<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI English Teacher</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 24px;
            font-size: 1.75rem;
        }

        .control-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        select, textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            min-width: 130px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .btn-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .btn-danger:hover {
            background-color: #fecaca;
        }

        .loading {
            text-align: center;
            font-style: italic;
            color: #64748b;
            margin: 20px 0;
        }

        .hidden {
            display: none;
        }

        .output-box {
            margin-top: 24px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
            border-left: 5px solid var(--primary-color);
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 1.05rem;
            min-height: 150px;
        }

        footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎓 Global AI English Teacher</h1>

        <!-- Language Selector -->
        <div class="control-group">
            <label for="languageSelect">Explanation Language:</label>
            <select id="languageSelect">
                <option value="English">English</option>
                <option value="Arabic">Arabic (العربية)</option>
                <option value="Spanish">Spanish (Español)</option>
                <option value="Latin American Spanish">Latin American Spanish (Español Latinoamericano)</option>
                <option value="French">French (Français)</option>
                <option value="Portuguese">Portuguese (Português)</option>
                <option value="Brazilian Portuguese">Brazilian Portuguese (Português do Brasil)</option>
                <option value="Bengali">Bengali (বাংলা)</option>
                <option value="Vietnamese">Vietnamese (Tiếng Việt)</option>
                <option value="Japanese">Japanese (日本語)</option>
                <option value="Chinese">Chinese (中文)</option>
            </select>
        </div>

        <!-- Grade Level Selector -->
        <div class="control-group">
            <label for="gradeSelect">Target Grade Level / Proficiency:</label>
            <select id="gradeSelect">
                <option value="Elementary (Grades 1-4) - Simple words, fun examples, very clear basics">Elementary (Grades 1-4)</option>
                <option value="Middle School (Grades 5-8) - Clear grammar rules, structured examples, moderate pace">Middle School (Grades 5-8)</option>
                <option value="High School (Grades 9-12) - Advanced rules, detailed explanations, academic context" selected>High School (Grades 9-12)</option>
                <option value="Adult Learner / Professional - Practical, direct, comprehensive usage">Adult Learner / Professional</option>
            </select>
        </div>

        <!-- Topic Input -->
        <div class="control-group">
            <label for="topicInput">What do you want to learn or ask?</label>
            <textarea id="topicInput" placeholder="e.g., How do I use the Present Perfect tense? Or type a grammar question..."></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="button-row">
            <button id="speakBtn" class="btn-secondary">🎙️ Speak</button>
            <button id="askTeacherBtn" class="btn-primary">Ask Teacher</button>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading hidden">
            Teacher is preparing your custom lesson... ⏳
        </div>

        <!-- Lesson Output Section -->
        <div id="lessonOutput" class="output-box">Your generated AI lesson will appear here...</div>

        <!-- Audio & Utility Controls -->
        <div class="button-row">
            <button id="listenBtn" class="btn-secondary">🔊 Listen</button>
            <button id="stopVoiceBtn" class="btn-danger">⏹️ Stop Voice</button>
        </div>

        <div class="button-row">
            <button id="newLessonBtn" class="btn-secondary">🔄 New Lesson</button>
            <button id="copyBtn" class="btn-secondary">📋 Copy Lesson</button>
            <button id="downloadBtn" class="btn-secondary">📥 Download</button>
        </div>

        <footer>
            Global English AI Learning App © 2026
        </footer>
    </div>

    <script>
        // PASTE YOUR GEMINI API KEY INSIDE THE QUOTES BELOW:
        const GEMINI_API_KEY = "AQ.Ab8RN6L9nLXQq6p9DByXq9C3j7EZ8OY6AYZUV05SqBuwFhPh4Q"; 

        // Safety verification check
        if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
            alert('Please insert your Gemini API key in the JavaScript code section.');
        }

        const languageSelect = document.getElementById('languageSelect');
        const gradeSelect = document.getElementById('gradeSelect');
        const topicInput = document.getElementById('topicInput');
        const askTeacherBtn = document.getElementById('askTeacherBtn');
        const speakBtn = document.getElementById('speakBtn');
        const listenBtn = document.getElementById('listenBtn');
        const stopVoiceBtn = document.getElementById('stopVoiceBtn');
        const newLessonBtn = document.getElementById('newLessonBtn');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const lessonOutput = document.getElementById('lessonOutput');

        // Ask Teacher AI Integration
        askTeacherBtn.addEventListener('click', async () => {
            const topic = topicInput.value.trim();
            const selectedLang = languageSelect.value;
            const selectedGrade = gradeSelect.value;

            if (!topic) {
                alert('Please enter a topic or question first.');
                return;
            }

            if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE" || !GEMINI_API_KEY) {
                alert('Please insert your Gemini API key in the JavaScript code section.');
                return;
            }

            loadingIndicator.classList.remove('hidden');
            lessonOutput.textContent = "";

            const systemPrompt = `You are a world-class expert English teacher. 
            The user wants a structured lesson or answer about: "${topic}".
            Target Learner Level: ${selectedGrade}. 
            Explain and format the lesson entirely in **${selectedLang}**, perfectly adjusted to the vocabulary, pacing, and complexity expected for this specific level.
            
            CRITICAL RULE: All English grammatical or structural terminologies (such as letter, word, sentence, parts of speech, noun, pronoun, verb, adjective, article, preposition, clause, tense, subject, object, active voice, passive voice, etc.) MUST ALWAYS BE KEPT IN ENGLISH inside the text, even when explaining in ${selectedLang}. Make the lesson engaging, well-structured with clear examples, and educational.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const lessonText = data.candidates[0].content.parts[0].text;
                    lessonOutput.textContent = lessonText;
                } else {
                    console.error("API Response Error:", data);
                    lessonOutput.textContent = "Error: Could not parse response. Check your API key permissions.";
                }
            } catch (error) {
                console.error(error);
                lessonOutput.textContent = "Network error connecting to AI teacher. Check your connection or API key settings.";
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        });

        // Speech-to-Text (Speak button)
        speakBtn.addEventListener('click', () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Speech recognition is not supported in this browser. Try Chrome or Android browser.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                speakBtn.textContent = 'Listening... 🎙️';
            };

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                topicInput.value = speechResult;
            };

            recognition.onerror = (event) => {
                alert('Speech recognition error: ' + event.error);
            };

            recognition.onend = () => {
                speakBtn.textContent = '🎙️ Speak';
            };

            recognition.start();
        });

        // Text-to-Speech (Listen button)
        listenBtn.addEventListener('click', () => {
            const text = lessonOutput.textContent;
            if (!text || text.includes('Your generated AI lesson')) {
                alert('No lesson available to read.');
                return;
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9; // Slightly slower for better learning clarity
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Text-to-speech is not supported by your browser.');
            }
        });

        // Stop Voice button
        stopVoiceBtn.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        });

        // New Lesson button
        newLessonBtn.addEventListener('click', () => {
            topicInput.value = '';
            lessonOutput.textContent = 'Your generated AI lesson will appear here...';
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        });

        // Copy Lesson button
        copyBtn.addEventListener('click', () => {
            const text = lessonOutput.textContent;
            if (!text || text.includes('Your generated AI lesson')) {
                alert('Nothing to copy.');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                alert('Lesson copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy text.');
            });
        });

        // Download Lesson button
        downloadBtn.addEventListener('click', () => {
            const text = lessonOutput.textContent;
            if (!text || text.includes('Your generated AI lesson')) {
                alert('Nothing to download.');
                return;
            }
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'english-ai-lesson.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
