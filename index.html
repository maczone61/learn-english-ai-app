<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI English Teacher</title>
    <!-- Tailwind CSS for modern, clean UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">🎓 Global AI English Teacher</h1>
            
            <!-- Language Selector -->
            <div class="flex items-center gap-2">
                <label for="languageSelect" class="text-sm font-medium">Language:</label>
                <select id="languageSelect" class="bg-indigo-700 text-white text-sm rounded px-2 py-1 border border-indigo-500 focus:outline-none">
                    <option value="English">English</option>
                    <option value="Arabic">Arabic (العربية)</option>
                    <option value="Spanish">Spanish (Español)</option>
                    <option value="French">French (Français)</option>
                    <option value="Portuguese">Portuguese (Português)</option>
                    <option value="Brazilian Portuguese">Brazilian Portuguese (Português do Brasil)</option>
                    <option value="Vietnamese">Vietnamese (Tiếng Việt)</option>
                    <option value="Japanese">Japanese (日本語)</option>
                    <option value="Chinese">Chinese (中文)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow flex flex-col gap-4">
        
        <!-- Input & Ask Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <label for="topicInput" class="text-sm font-semibold text-slate-700">What do you want to learn or ask?</label>
            <div class="flex gap-2">
                <input type="text" id="topicInput" placeholder="e.g., How to use present continuous tense, or ask a question..." 
                    class="flex-grow border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button id="speakInputBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-medium transition flex items-center gap-1" title="Speak to input">
                    🎙️ Speak
                </button>
            </div>
            <button id="askTeacherBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition">
                Ask Teacher
            </button>
        </div>

        <!-- Action Controls Bar -->
        <div class="flex flex-wrap gap-2 items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-slate-200">
            <div class="flex flex-wrap gap-2">
                <button id="listenBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-3 py-1.5 rounded-lg font-medium transition">🔊 Listen</button>
                <button id="stopVoiceBtn" class="bg-rose-600 hover:bg-rose-700 text-white text-sm px-3 py-1.5 rounded-lg font-medium transition">⏹️ Stop Voice</button>
            </div>
            <div class="flex flex-wrap gap-2">
                <button id="newLessonBtn" class="bg-slate-600 hover:bg-slate-700 text-white text-sm px-3 py-1.5 rounded-lg font-medium transition">🔄 New Lesson</button>
                <button id="copyLessonBtn" class="bg-amber-600 hover:bg-amber-700 text-white text-sm px-3 py-1.5 rounded-lg font-medium transition">📋 Copy Lesson</button>
                <button id="downloadLessonBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1.5 rounded-lg font-medium transition">📥 Download</button>
            </div>
        </div>

        <!-- Lesson Display Area -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex-grow min-h-[300px] relative">
            <div id="loadingIndicator" class="hidden absolute inset-0 bg-white/80 flex items-center justify-center font-medium text-indigo-600">
                Teacher is preparing your custom lesson... ⏳
            </div>
            <div id="lessonOutput" class="prose max-w-none text-slate-700 whitespace-pre-wrap">
                Your AI teacher is ready. Enter a topic or ask a question above and click "Ask Teacher"!
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 p-4">
        Global English AI Learning App &copy; 2026
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // NOTE: Replace with your actual Gemini API Key or your backend endpoint proxy
        const GEMINI_API_KEY = "AQ.Ab8RN6I5ucqPKWXAuGB9F3HfHP0xTcAy3FVRgjXdqgaqhRGVhw"; 

        const topicInput = document.getElementById('topicInput');
        const languageSelect = document.getElementById('languageSelect');
        const askTeacherBtn = document.getElementById('askTeacherBtn');
        const speakInputBtn = document.getElementById('speakInputBtn');
        const listenBtn = document.getElementById('listenBtn');
        const stopVoiceBtn = document.getElementById('stopVoiceBtn');
        const newLessonBtn = document.getElementById('newLessonBtn');
        const copyLessonBtn = document.getElementById('copyLessonBtn');
        const downloadLessonBtn = document.getElementById('downloadLessonBtn');
        const lessonOutput = document.getElementById('lessonOutput');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // 1. Ask Teacher (AI Generation)
        askTeacherBtn.addEventListener('click', async () => {
            const topic = topicInput.value.trim();
            const selectedLang = languageSelect.value;

            if (!topic) {
                alert('Please enter a topic or question first.');
                return;
            }

            if (GEMINI_API_KEY === "AQ.Ab8RN6I5ucqPKWXAuGB9F3HfHP0xTcAy3FVRgjXdqgaqhRGVhw") {
                alert('Please insert your Gemini API key in the JavaScript code section.');
                return;
            }

            loadingIndicator.classList.remove('hidden');

            const systemPrompt = `You are a highly experienced academic teaching expert who knows every English curriculum taught around the world. 
            The user wants a lesson or an answer about: "${topic}".
            Explain and discuss everything in **${selectedLang}**. 
            CRITICAL RULE: All English grammatical or structural terminologies (such as letter, word, sentence, parts of speech, noun, pronoun, verb, adjective, article, preposition, clause, tense, etc.) MUST ALWAYS BE WRITTEN IN ENGLISH inside the text, even when explaining in ${selectedLang}. Make the lesson structured, clear, and educational.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt }] }]
                    })
                });

                const data = await response.json();
                const lessonText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, could not generate a lesson at this time.";
                lessonOutput.textContent = lessonText;
            } catch (error) {
                console.error(error);
                alert("Error connecting to AI teacher.");
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        });

        // 2. Speech-to-Text (Speak button to fill input box)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            speakInputBtn.addEventListener('click', () => {
                recognition.start();
                speakInputBtn.textContent = "Listening...";
            });

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                topicInput.value = speechToText;
                speakInputBtn.textContent = "🎙️ Speak";
            };

            recognition.onerror = () => {
                speakInputBtn.textContent = "🎙️ Speak";
            };

            recognition.onend = () => {
                speakInputBtn.textContent = "🎙️ Speak";
            };
        } else {
            speakInputBtn.style.display = 'none'; // Hide if browser doesn't support speech recognition
        }

        // 3. Text-to-Speech (Listen button)
        listenBtn.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const text = lessonOutput.textContent;
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Text-to-speech is not supported in your browser.');
            }
        });

        // 4. Stop Voice
        stopVoiceBtn.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        });

        // 5. New Lesson (Reset)
        newLessonBtn.addEventListener('click', () => {
            topicInput.value = '';
            lessonOutput.textContent = 'Your AI teacher is ready. Enter a topic or ask a question above and click "Ask Teacher"!';
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        });

        // 6. Copy Lesson
        copyLessonBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(lessonOutput.textContent).then(() => {
                alert('Lesson copied to clipboard!');
            });
        });

        // 7. Download Lesson
        downloadLessonBtn.addEventListener('click', () => {
            const text = lessonOutput.textContent;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'English_Lesson.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
